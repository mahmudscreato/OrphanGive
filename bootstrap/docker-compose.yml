# OrphanGive — Directus stack
# Runs on a single Hostinger VPS (KVM 2 or larger)
# Three services: Directus + Postgres + Caddy (auto-SSL reverse proxy)
#
# Place this file at /opt/orphangive/docker-compose.yml
# Place .env (copied from .env.example) in the same folder
# Run: docker compose up -d

services:

  # -------------------------------------------------
  # POSTGRES — the database
  # -------------------------------------------------
  database:
    image: postgis/postgis:15-3.4-alpine
    container_name: og-database
    restart: unless-stopped
    volumes:
      - ./data/database:/var/lib/postgresql/data
    networks:
      - directus
    environment:
      POSTGRES_USER: 'directus'
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: 'directus'
    healthcheck:
      test: ["CMD", "pg_isready", "--host=localhost", "--username=directus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -------------------------------------------------
  # REDIS — caching layer for Directus
  # -------------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: og-cache
    restart: unless-stopped
    networks:
      - directus
    healthcheck:
      test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------
  # DIRECTUS — the admin panel + API
  # -------------------------------------------------
  directus:
    image: directus/directus:latest
    container_name: og-directus
    restart: unless-stopped
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
      - ./snapshots:/directus/snapshots
    networks:
      - directus
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      # core
      KEY: ${KEY}
      SECRET: ${SECRET}
      PUBLIC_URL: ${PUBLIC_URL}

      # admin user (created on first run)
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # database
      DB_CLIENT: 'pg'
      DB_HOST: 'database'
      DB_PORT: 5432
      DB_DATABASE: 'directus'
      DB_USER: 'directus'
      DB_PASSWORD: ${DB_PASSWORD}

      # cache
      CACHE_ENABLED: 'true'
      CACHE_AUTO_PURGE: 'true'
      CACHE_STORE: 'redis'
      REDIS: 'redis://cache:6379'

      # cors — allow our public site to call the API
      CORS_ENABLED: 'true'
      CORS_ORIGIN: ${CORS_ORIGIN}

      # storage — defaults to local; uncomment Cloudinary section in .env to switch
      STORAGE_LOCATIONS: ${STORAGE_LOCATIONS:-local}
      STORAGE_LOCAL_DRIVER: 'local'
      STORAGE_LOCAL_ROOT: '/directus/uploads'

      # cloudinary (used when STORAGE_LOCATIONS=cloud)
      STORAGE_CLOUD_DRIVER: ${STORAGE_CLOUD_DRIVER:-}
      STORAGE_CLOUD_CLOUD_NAME: ${STORAGE_CLOUD_CLOUD_NAME:-}
      STORAGE_CLOUD_API_KEY: ${STORAGE_CLOUD_API_KEY:-}
      STORAGE_CLOUD_API_SECRET: ${STORAGE_CLOUD_API_SECRET:-}

      # email — via Resend SMTP
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TRANSPORT: 'smtp'
      EMAIL_SMTP_HOST: 'smtp.resend.com'
      EMAIL_SMTP_PORT: 465
      EMAIL_SMTP_USER: 'resend'
      EMAIL_SMTP_PASSWORD: ${RESEND_API_KEY}
      EMAIL_SMTP_SECURE: 'true'

      # observability
      LOG_LEVEL: 'info'
      LOG_STYLE: 'pretty'

      # security
      RATE_LIMITER_ENABLED: 'true'
      RATE_LIMITER_POINTS: 50
      RATE_LIMITER_DURATION: 1

      # session
      ACCESS_TOKEN_TTL: '15m'
      REFRESH_TOKEN_TTL: '7d'
      REFRESH_TOKEN_COOKIE_SECURE: 'true'
      REFRESH_TOKEN_COOKIE_SAME_SITE: 'lax'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8055/server/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -------------------------------------------------
  # CADDY — reverse proxy with automatic SSL from Let's Encrypt
  # -------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: og-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - directus
    depends_on:
      - directus

networks:
  directus:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
